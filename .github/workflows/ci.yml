name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# onnxruntime-node's postinstall script downloads the optional CUDA execution
# provider binaries on Linux/x64, and the upstream URL for the pinned version
# returns 404. The CPU binaries are bundled in the package and this project
# never uses CUDA, so the download is skipped. The `.npmrc` in the repository
# sets the same thing for `npm ci`; this environment variable is the
# documented, forward-compatible equivalent and is checked first by the
# install script.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  evaluation:
    name: Reproducible evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the evaluation suites
        # The model weights are fetched from the Hugging Face CDN on first use.
        # The report is written to a scratch path so the committed report stays
        # untouched: the regression gate below has to compare against it.
        env:
          NODE_USE_ENV_PROXY: '1'
        run: npm run evaluate -- --out=reports/evaluation.fresh.json

      - name: Upload the evaluation report
        # Uploaded before the gate so the fresh report is available for
        # inspection even when the gate fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            reports/evaluation.json
            reports/evaluation.fresh.json
          if-no-files-found: error

      - name: Fail if the evaluation behaviour changed
        # A change to the AI layer must be accompanied by a regenerated report,
        # so the measured behaviour cannot shift silently.
        #
        # This compares the *decisions* of a fresh run against the committed
        # report. Wall-clock fields (timestamps, latency) are excluded because
        # they change on every run; a plain file diff would fail every time and
        # would not be a usable gate.
        env:
          NODE_USE_ENV_PROXY: '1'
        run: npm run evaluate:check
